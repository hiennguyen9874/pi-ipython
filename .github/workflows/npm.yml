name: Build and publish npm package

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            console.error('Release tag must match a stable package.json version (for example, v0.1.0).');
            process.exitCode = 1;
          }
          JS
      - name: Extract release notes
        if: github.ref_type == 'tag'
        run: |
          mkdir -p artifacts
          awk -v heading="[${GITHUB_REF_NAME#v}]" '
            /^## / { if (found) exit; found = ($2 == heading); next }
            found { print }
          ' CHANGELOG.md > artifacts/release-notes.md
          if ! grep -q '[^[:space:]]' artifacts/release-notes.md; then
            echo "Add release notes under ## [${GITHUB_REF_NAME#v}] in CHANGELOG.md." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack npm tarball
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Publish packaged artifact to npm
        run: npm publish "./artifacts/pi-ipython-${GITHUB_REF_NAME#v}.tgz" --access public --ignore-scripts

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json url --jq .url; then
            echo "GitHub Release already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file artifacts/release-notes.md
          fi
