[project]
name = "pi-ipython-runtime"
version = "0.1.0"
description = "Kernel runtime for pi-ipython (vendored Unharnessed rlm)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "tyro",
]

[dependency-groups]
dev = ["dill", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

[tool.pytest.ini_options]
testpaths = ["test"]
